name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  APP_NAME: trade-signals-app
  K8S_NAMESPACE: trade-signals

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extract git SHA for tagging
      - name: Set image tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "TAG=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_NAME }}-backend" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_NAME }}-frontend" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ steps.vars.outputs.TAG }}
            ${{ steps.vars.outputs.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ steps.vars.outputs.TAG }}
            ${{ steps.vars.outputs.FRONTEND_IMAGE }}:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Recreate SHA tag for deploy stage
      - name: Set image tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "TAG=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_NAME }}-backend" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_NAME }}-frontend" >> $GITHUB_OUTPUT

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # Configure kubeconfig (stored as base64-encoded secret)
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update backend & frontend images
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/backend \
            backend=${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ steps.vars.outputs.TAG }}

          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/frontend \
            frontend=${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ steps.vars.outputs.TAG }}

      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/backend
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/frontend
