services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: trade-signals-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: trade-signals-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
