apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trade-signals-ingress
  namespace: trade-signals
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: trade-signals.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
